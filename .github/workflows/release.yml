name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Verify release source and successful main CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          node scripts/check-release-ci.mjs

      # npm 包统一在本机发布；workflow 只校验该版本已经存在于 npm，
      # 避免「Release 已创建但 npm 上没有这个版本」的发布事故。
      - name: Verify npm version was published locally
        run: |
          version=$(node -p "require('./package.json').version")
          npm view "dsh-lan-canvas@$version" version >/dev/null \
            || { echo "::error::npm 上缺少 dsh-lan-canvas@$version：请先在发布机器上完成本机 npm 发布（见 README「开发」），再推送 tag。"; exit 1; }

      # 相同 SHA 的 main CI 成功后，重新执行与 CI 一致的完整门禁。
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify committed dist and notices are up to date
        run: |
          npm run notices
          if [ -n "$(git status --porcelain -- dist THIRD-PARTY-NOTICES.md)" ]; then
            git status --porcelain -- dist THIRD-PARTY-NOTICES.md
            echo "::error::dist/ 或 THIRD-PARTY-NOTICES.md 与源码不一致。"
            exit 1
          fi

      - name: Require a browser for E2E
        shell: bash
        run: |
          browser_path=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if browser_path="$(command -v "$candidate")" && [ -x "$browser_path" ]; then
              break
            fi
          done
          if [ -z "$browser_path" ] || [ ! -x "$browser_path" ]; then
            echo "::error::发布验收必须提供可用 Chrome/Chromium，浏览器 E2E 不允许跳过。"
            exit 1
          fi
          "$browser_path" --version
          echo "DSH_CANVAS_BROWSER=$browser_path" >> "$GITHUB_ENV"
          echo "DSH_CANVAS_REQUIRE_BROWSER=1" >> "$GITHUB_ENV"

      - name: Test
        run: npm test

      - name: Verify codegen compiles (adapter stubs)
        run: npm run verify:codegen

      - name: Bundle self-check
        run: npm run check:bundle

      - name: Installable package contents
        run: npm run check:pack

      - name: Verify all original compositions
        run: npm run verify:prototypes -- --out .tmp/release-prototypes

      - name: Retain composition review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-review-${{ github.ref_name }}
          path: .tmp/release-prototypes
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: Collect release notes
        run: |
          # 门禁已校验稳定标签、版本一致性和非空发布说明，禁止回退。
          bare="${GITHUB_REF_NAME#v}"
          test -s "release/release-${bare}.md"
          cp -- "release/release-${bare}.md" RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # 完整验收耗时期间若 CI 被重跑或取消，创建发布前再次拒绝非成功状态。
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          node scripts/check-release-ci.mjs
          gh release create "$GITHUB_REF_NAME" --verify-tag --repo "$GITHUB_REPOSITORY" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md

      - name: Attach installable bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release 资产是安装失败（裸包名撞 npm 占位包）的稳定替代入口：
          # pnpm 可直接以该 .tgz URL 安装，包内已由 check:pack 验证含 cordis.patch.yml。
          mkdir -p .tmp/release-assets
          npm pack --pack-destination .tmp/release-assets --ignore-scripts
          gh release upload "$GITHUB_REF_NAME" .tmp/release-assets/*.tgz \
            --repo "$GITHUB_REPOSITORY" --clobber
